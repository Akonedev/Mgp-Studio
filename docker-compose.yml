services:
  open-generative-ai:
    build: .
    container_name: open-generative-ai
    ports:
      - "58102:58101"
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./public/outputs:/app/public/outputs
      - ./public/samples:/app/public/samples
    restart: unless-stopped
